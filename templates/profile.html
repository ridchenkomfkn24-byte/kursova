{% extends 'base.html' %}
{% block title %}Профіль — Словопростір{% endblock %}
{% block content %}<section class="container narrow-page"><a class="back-link" href="{{ url_for('dashboard') }}">← До кабінету</a><div class="eyebrow">ПРО ТЕБЕ</div><h1>Познайомимось ближче.</h1><form method="post" class="stack-form form-panel"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Ім’я<input name="name" minlength="2" maxlength="60" required value="{{ request.form.get('name', current_user.name) }}" autocomplete="name"></label><label>Кілька слів про себе<textarea name="bio" rows="5" maxlength="300" placeholder="Що тебе захоплює? Про що ти пишеш?">{{ request.form.get('bio', current_user.bio) }}</textarea><span class="field-help">До 300 символів. Опис відображається під твоїми статтями.</span></label><button class="button" type="submit">Зберегти зміни ↗</button></form></section>{% endblock %}
